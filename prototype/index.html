<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>LittleStride · 小步学</title>
<link rel="stylesheet" href="design.css"></head><body><div class="shell"><header class="top"><div class="brand"><img class="brand-mark" src="brand-mark.png" alt="">LittleStride</div><div class="header-actions"><button class="theme-toggle" onclick="toggleTheme()" aria-label="切换深色或浅色外观" title="切换外观">◐</button><button class="avatar" onclick="go('profile')" aria-label="孩子档案">小禾</button></div></header><div class="demo"><span>交互原型 · 示例数据</span><button onclick="resetDemo()">重置演示</button></div><main id="app" tabindex="-1"></main><nav class="nav" id="nav" aria-label="主要导航"></nav></div><div id="printArea"></div><script>
const icons={home:'<path d="M3 10 12 3l9 7v10H3Z"/><path d="M9 20v-7h6v7"/>',camera:'<path d="M3 7h4l2-3h6l2 3h4v13H3Z"/><circle cx="12" cy="13" r="4"/>',book:'<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 7h8M8 11h8M8 15h5"/>',chart:'<path d="M4 3v18h17M8 16v-4M13 16V7M18 16V4"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[n]}</svg>`;
let state={page:'home',mode:'source',filter:'全部',confirmed:false,generated:false,deferred:false,reviewed:false,reminder:true,limit:10,remindAt:'19:45',upload:'',photo:'',selected:[true,true,true],reviewReady:false,subjects:["数学","语文"],counts:{数学:2,语文:1,英语:1},claimed:false,profile:{name:"小禾",birthDate:"",grade:"三年级",region:"上海",term:"上学期",books:{数学:"",语文:"",英语:""}},observations:{},assessmentDate:"",syncEnabled:false,lastSync:"",shareBadge:true,shareQuestion:true,ai:{provider:"自定义兼容服务",protocol:"responses",url:"https://api.example.com/v1",model:"",auth:"Bearer",method:"key",effort:"default",saved:false,result:""}};
const $=s=>document.querySelector(s);
const btn=(t,act,cls='')=>`<button class="button ${cls}" onclick="${act}">${t}</button>`;
// Back controls are rendered from the actual navigation stack, not page defaults.
const navigation={root:'home',stack:[]};
const back=()=>'';
function toast(t){document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3500)}
function go(p){if(p===state.page){render();return}if(p==='print'&&state.page==='home')state.selected=printSelection();navigation.stack.push({page:state.page,scrollY:window.scrollY||0});state.page=p;render();window.scrollTo(0,0)}
function selectTab(p){navigation.root=p;navigation.stack=[];state.page=p;render();window.scrollTo(0,0)}
function goBack(){const previous=navigation.stack.pop();if(!previous)return;state.page=previous.page;render();window.scrollTo(0,previous.scrollY)}
function resetDemo(){navigation.root='home';navigation.stack=[];if(state.photo)URL.revokeObjectURL(state.photo);state={page:'home',mode:'source',filter:'全部',confirmed:false,generated:false,deferred:false,reviewed:false,reminder:true,limit:10,remindAt:'19:45',upload:'',photo:'',selected:[true,true,true],reviewReady:false,subjects:["数学","语文"],counts:{数学:2,语文:1,英语:1},claimed:false,profile:{name:"小禾",birthDate:"",grade:"三年级",region:"上海",term:"上学期",books:{数学:"",语文:"",英语:""}},observations:{},assessmentDate:"",syncEnabled:false,lastSync:"",shareBadge:true,shareQuestion:true,ai:{provider:"自定义兼容服务",protocol:"responses",url:"https://api.example.com/v1",model:"",auth:"Bearer",method:"key",effort:"default",saved:false,result:""}};render();toast('演示已重置')}
function render(){document.querySelector('.avatar').textContent=state.profile.name;let active=navigation.root;$('#nav').innerHTML=[['home','home','今日'],['capture','camera','拍照'],['library','book','错题库'],['progress','chart','进展']].map(([p,i,t])=>`<button class="${active===p?'active ':''}${p==='capture'?'capture-nav':''}" aria-current="${active===p?'page':'false'}" onclick="selectTab('${p}')"><span>${icon(i)}</span><span>${t}</span></button>`).join('');$('#app').innerHTML=(navigation.stack.length?'<button class="back" onclick="goBack()" aria-label="返回上一页">← 返回</button>':'')+views[state.page]();}
const views={
ai:()=>`<div class="eyebrow">AI SERVICE</div><h1>连接你的 AI 服务</h1><p class="sub">用于教材识别、错题分析、出题与回录。</p>
<div class="note warn">交互原型，不发送请求。请勿填写真实 Key；密钥输入已禁用。</div>
<div class="card"><h3>接入方式</h3><div class="tabs">${['key','account'].map(x=>`<button class="${state.ai.method===x?'active':''}" onclick="updateAI('method','${x}');render()">${x==='key'?'API Key':'账号授权'}</button>`).join('')}</div>
<label for="aip">服务商</label><select id="aip" onchange="updateAI('provider',this.value);render()">${Object.keys(aiProviders).map(x=>`<option ${state.ai.provider===x?'selected':''}>${x}</option>`).join('')}</select>
<p class="mini">${esc(aiProviders[state.ai.provider].guide)}</p>${aiProviders[state.ai.provider].console?`<a class="link" href="${aiProviders[state.ai.provider].console}" target="_blank" rel="noopener noreferrer">登录控制台 / 获取 API Key ↗</a>`:''}
${state.ai.method==='account'?`<div class="note">账号授权尚未接入。登录控制台不会自动授权 App。Codex auth.json 中的登录令牌不能作为这里的 API Key。</div>${btn('改用 API Key',"updateAI('method','key');render()",'light wide')}`:`${state.ai.provider!=='自定义兼容服务'?btn('填入推荐参数',"applyAIProvider()",'light wide'):''}
<label for="aipro">接口协议</label><select id="aipro" onchange="updateAI('protocol',this.value);render()">${Object.entries({responses:'Responses',chat:'Chat Completions',anthropic:'Anthropic Messages'}).map(([v,t])=>`<option value="${v}" ${state.ai.protocol===v?'selected':''}>${t}</option>`).join('')}</select>
<label for="aiurl">Base URL</label><input id="aiurl" type="url" value="${esc(state.ai.url)}" oninput="updateAI('url',this.value);document.getElementById('endpoint').textContent=aiEndpoint()" autocomplete="off" spellcheck="false"><p class="mini">保留 /v1 等基础路径，不含 /responses、/chat/completions 或 /messages。</p>
<div class="note" style="overflow-wrap:anywhere">请求路径预览<br><span id="endpoint">${esc(aiEndpoint())}</span></div>
<label for="aimodel">模型 ID</label><input id="aimodel" value="${esc(state.ai.model)}" oninput="updateAI('model',this.value)" placeholder="从服务商模型列表复制准确 ID" spellcheck="false"><p class="mini">照片分析需要支持图片的模型，文本连接通过不能证明图片能力。</p>
<label>API Key</label><input type="password" disabled placeholder="原型禁用 · 正式版保存至本机 Keychain"><p class="mini">只填密钥本身。env_key 是变量名称，需要填写变量的实际值。</p>
<label for="aiauth">认证方式</label><select id="aiauth" onchange="updateAI('auth',this.value)">${['Bearer','x-api-key'].map(x=>`<option ${state.ai.auth===x?'selected':''}>${x}</option>`).join('')}</select><p class="mini">Bearer 对应 Authorization + Bearer；Claude 官方用 x-api-key 且不加 Bearer。原生版可填写自定义请求头。</p>
${state.ai.protocol==='responses'?`<label>模型思考强度</label><select onchange="updateAI('effort',this.value)">${Object.entries({default:'服务默认',low:'低',medium:'中',high:'高'}).map(([v,t])=>`<option value="${v}" ${state.ai.effort===v?'selected':''}>${t}</option>`).join('')}</select>`:''}<p class="mini">正式版请求非流式结果，也兼容服务商返回的 SSE。思考强度仅用于支持该参数的 Responses 模型。</p>`}</div>
${state.ai.method==='key'?`<div class="actions">${btn('保存演示配置',"saveAI()",'light')}${btn('演示连接检测',"testAI()")}</div><div class="card"><h3>检测结果演示</h3><select onchange="state.ai.result=this.value;render()"><option value="">尚未演示</option>${['流程通过示例','401 认证失败示例','404 路径不匹配示例','图片能力不支持示例'].map(x=>`<option ${state.ai.result===x?'selected':''}>${x}</option>`).join('')}</select><div class="note">${esc(aiResult())}</div></div>`:''}
<div class="card"><h3>实际检查状态</h3>${['认证与文本请求','图片输入能力','结构化结果格式'].map(x=>`<div class="item"><span class="itembody">${x}</span><span class="pill gray">未实际检测</span></div>`).join('')}<p class="mini">真实请求次数：0。识别成功后仍须核对并保存。</p></div>`,

profile:()=>`${back()}<div class="eyebrow">CHILD PROFILE</div><h1>从了解孩子开始</h1><p class="sub">教材按学科填写，不根据地区自动猜版本。</p><div class="card"><h3>基本信息</h3><label>昵称</label><input id="pn" maxlength="12" value="${esc(state.profile.name)}"><div class="grid"><div><label for="pd">出生日期（可选）</label><input id="pd" type="date" max="${localDateString()}" value="${esc(state.profile.birthDate || '')}" onchange="updateProfileAge()"><p class="mini" id="profileAge">${profileAgeText(state.profile.birthDate)}</p></div><div><label>年级</label><select id="pg">${['一年级','二年级','三年级','四年级','五年级','六年级'].map(n=>`<option ${n===state.profile.grade?'selected':''}>${n}</option>`).join('')}</select></div></div><label>学习地区</label><input id="pr" maxlength="30" value="${esc(state.profile.region)}" placeholder="省 / 市"><label>学期</label><select id="pt">${['上学期','下学期'].map(n=>`<option ${state.profile.term===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="card"><h3>各科教材与当前进度</h3>${['数学','语文','英语'].map((n,i)=>`<label>${n}</label><input id="pb${i}" maxlength="100" value="${esc(state.profile.books[n])}" placeholder="出版社 / 版本 / 册次 / 当前单元">`).join('')}<p class="mini">不确定可留空，后续补拍封面或版权页核实。原型仅记录文本，尚未接入教材目录。</p></div>${btn('保存孩子档案',"saveProfile()",'wide')}<div class="card"><h3>能力观察</h3><p class="sub">约 3 分钟的家长观察，结合真实作答逐步补充。</p><div class="actions">${btn('填写观察',"go('assessment')",'light')}${btn('看多维分析',"go('ability')",'ghost')}</div></div><div class="card"><div class="row"><h3>AI 服务设置</h3><span class="pill gray">${state.ai.saved?'配置已保存 · 未连接':'尚未连接'}</span></div><p class="sub">设置服务商、接口协议与模型，检查照片分析能力。</p>${btn('配置 AI 服务',"go('ai')",'light wide')}</div><div class="card"><h3>数据与计划</h3><div class="actions">${btn('iCloud 与数据迁移',"go('sync')",'light')}${btn('提醒与时间',"go('settings')",'ghost')}</div></div><div class="note">出生日期可留空，年龄会自动计算。无须填写真名或学校。当前为本地页面演示，刷新会重置填写内容；可导出演示备份。</div>`,
assessment:()=>`${back('profile')}<div class="eyebrow">LEARNING OBSERVATION</div><h1>先观察，再下判断</h1><p class="sub">回想最近两周。没有观察过就选“不清楚”，不用额外考孩子。</p><div class="note">约 3 分钟 · 可分次补充。这里记录家长观察，不生成智力、性格或注意力诊断。</div>${observationItems.map(([id,group,title,question])=>`<div class="card"><span class="pill gray">${group}</span><h3 style="margin-top:13px">${title}</h3><p class="sub">${question}</p><select onchange="state.observations['${id}']=this.value"><option value="">不清楚 / 未观察</option>${['多数时候独立完成','偶尔需要提醒','经常需要帮助'].map(v=>`<option ${state.observations[id]===v?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')}${btn('保存观察，查看分析',"state.assessmentDate=new Date().toLocaleDateString('zh-CN');go('ability');toast('已保存家长观察，未改变知识点掌握状态')",'wide')}`,
ability:()=>`${back('profile')}<div class="eyebrow">ABILITY OVERVIEW</div><h1>薄弱点，要有依据</h1><p class="sub">${esc(state.profile.name)} · ${esc(state.profile.grade)} · 不同能力分别观察</p><div class="grid" style="margin-top:16px"><div class="metric"><strong>${Object.values(state.observations).filter(Boolean).length} / ${observationItems.length}</strong><span>家长已观察维度</span></div><div class="metric"><strong>1</strong><span>有示例作答证据的维度</span></div></div><div class="note">家长观察与题目证据分别显示。未填写或未练过，不视为能力弱。${state.assessmentDate?'观察更新：'+esc(state.assessmentDate):''}</div>${['数学','语文','英语','学习过程'].map(group=>`<div class="row section"><h2>${group}</h2></div>${observationItems.filter(x=>x[1]===group).map(([id,g,title])=>`<div class="card"><div class="row"><h3>${title}</h3><span class="pill ${state.observations[id]==='经常需要帮助'?'warn':'gray'}">${state.observations[id]?state.observations[id]==='经常需要帮助'?'建议关注':state.observations[id]==='多数时候独立完成'?'相对顺利':'继续观察':'待观察'}</span></div><p class="sub">家长反馈：${state.observations[id]||'尚未观察'}</p><p class="mini">作答证据：${id==='mcalc'?'退位减法两次出现相同步骤错误；'+(state.reviewed?'本次两题正确，帮助程度见练习记录。':'订正后尚需间隔独立回看。'):'当前无对应作答证据，不作结论。'}</p>${id==='mcalc'?'<button class="link" onclick="go(\'detail\')">查看证据与代表题 →</button>':''}</div>`).join('')}`).join('')}<div class="card hero"><h3>下一步先做什么</h3><p>先确认退位规则，再用一道同类题回看；未确认的观察通过今后的作业逐步验证。</p><p class="sub">${Object.entries(state.observations).filter(([k,v])=>v==='经常需要帮助').length?'有需要关注的家长观察：先保留为核实线索，不自动叠加专项练习。':'继续积累真实作答，不为了补齐维度额外加测。'}</p></div><div class="actions">${btn('补充观察',"go('assessment')",'light')}${btn('调整今日计划',"go('subjects')")}</div>`,
share:()=>`${back('progress')}<div class="eyebrow">A LITTLE PROGRESS</div><h1>把这一步，留下来</h1><p class="sub">家长先预览，再决定保存或分享到哪里。</p><div class="card" style="background:#f4efdf;text-align:center;padding:28px 20px"><span class="pill">小步复习 · 示例成果</span><div style="font-size:60px;margin:16px">${state.reviewed?'🌟':'🌱'}</div><h2>${esc(state.profile.name)}的学习小记</h2><p class="sub">示例练习日 · 10 月 11 日</p>${state.reviewed?`<h1 style="font-size:25px;margin-top:20px">完成 2 道数学练习</h1>${state.shareQuestion?'<p>52 − 28 = 24<br>61 − 37 = 24</p>':''}<p>${state.h1==='独立'&&state.h2==='独立'?'两题独立完成。<br>下一步：隔天再试，看看是否稳定。':'两题完成并核对正确。<br>继续练习，逐步减少帮助。'}</p>${state.shareBadge?'<div class="card"><h3>🏅 十题小步</h3><p class="mini">累计完成 10 次有效练习<br>本次获得 2 成长积分</p></div>':''}`:'<p>本次还没有确认的练习结果。<br>完成回录后再生成成果卡。</p>'}<p class="mini" style="margin-top:20px">每一步进展，都来自真实的尝试。</p></div><div class="card"><h3>分享内容</h3><label class="check"><input type="checkbox" ${state.shareQuestion?'checked':''} onchange="state.shareQuestion=this.checked;render()">显示本次题目</label><label class="check"><input type="checkbox" ${state.shareBadge?'checked':''} onchange="state.shareBadge=this.checked;render()">显示已获得徽章与积分</label><p class="mini">只展示昵称与本次成果；不带出生日期、年龄、地区、教材、能力短板或原始作业照片。当前导出均标注“示例”。</p></div><div class="actions"><button class="button light" ${!state.reviewed?'disabled':''} onclick="saveShareImage(false)">保存成果图片</button><button class="button" ${!state.reviewed?'disabled':''} onclick="saveShareImage(true)">分享成果图片</button></div><div class="note">分享会调用手机系统选择界面，由你选择应用和接收对象。浏览器不支持时可保存图片，再自行分享。</div>`,
sync:()=>`${back('profile')}<div class="eyebrow">DATA & ICLOUD</div><h1>学习记录，跟着孩子走</h1><p class="sub">同一 App 换机恢复；跨 App 用结构化备份迁移。</p><div class="card"><div class="row"><h3>iCloud 同步</h3><span class="pill gray">原型未连接</span></div><label class="check"><input type="checkbox" ${state.syncEnabled?'checked':''} onchange="state.syncEnabled=this.checked;render()">演示启用同步</label><p class="sub">${state.syncEnabled?'已选择演示同步，尚未连接 Apple 账号。':'正式版使用当前设备的 iCloud 账号。'}</p><p class="mini">真实已上传：0 条 · 尚无真实同步时间</p><div class="actions">${btn('查看同步过程',"toast('流程演示：本地保存 → 等待网络 → 上传变化 → 拉取远端 → 合并；此页面不上传数据')",'light')}${btn('查看恢复预览',"document.getElementById('restoreInfo').classList.toggle('hidden')",'ghost')}</div><div id="restoreInfo" class="note hidden">恢复预览示例：档案 1 份、题目 4 道、薄弱点 3 项。正式版先显示账号、版本、记录与附件状态，再选择合并；这里不执行恢复。</div></div><div class="card"><h3>结构化保存的内容</h3>${['孩子档案与教材','原题、同类题及来源附件','知识点与薄弱点关联','每次作答、帮助程度和能力观察','计划、延期记录和奖励事件'].map(t=>`<div class="item"><span style="color:var(--green)">✓</span><span>${t}</span></div>`).join('')}<p class="mini">离线先保存；恢复网络后同步变更。同步不是历史备份，误删可能同步到其他设备。</p></div><div class="card"><h3>跨 App 迁移与备份</h3><p class="sub">其他 App 不能自动读取本 App 的私有 iCloud 数据。保留带版本和稳定编号的数据包，交给支持导入的应用。</p>${btn('导出当前演示数据 · JSON',"exportLearningData()",'wide light')}<p class="mini">此原型导出档案、观察、示例题目/知识点/作答与奖励状态；不包含原图和完整生产数据。正式版导出 JSON + 附件 + 清单组成的数据包。</p></div><div class="note">当前 HTML 原型无法实现真实 iCloud 同步。正式版 iOS App 需配置 iCloud/CloudKit、账号权限和恢复流程。本页只演示状态与入口；刷新仍会重置页面数据。</div>`,

home:()=>{const plan=todayPlan(),total=plan.reduce((n,x)=>n+x.minutes,0),count=plan.reduce((n,x)=>n+x.count,0);return `<div class="home-intro"><div class="date">10 月 11 日 · 周日 <span></span> 示例日程</div><h1>${esc(state.profile.name)}，今天也走一小步。</h1><p class="sub">${state.reviewed?'做过的每一次尝试，都在慢慢积累。':'留一点时间，把学过的知识练稳。'}</p></div><section class="today-summary" aria-label="今日练习概要"><div class="summary-caption"><strong>${total?'今日待练计划':'今日待练已清空'}</strong><span>每日上限 ${state.limit} 分钟</span></div><div class="summary-main"><div class="duration"><strong>${String(total).padStart(2,'0')}</strong><span>分钟左右</span></div><div class="summary-counts"><span><b>${plan.length}</b> 个学科</span><span><b>${count}</b> 道练习</span></div></div><div class="summary-footer">${total?btn('预览并打印练习单',"go('print')"):btn('查看这次的进展',"go('progress')")}<button class="button icon-action" onclick="state.mode='result';go('capture')" aria-label="拍照回录练习结果" title="拍照回录">${icon('camera')}</button></div></section><div class="row home-section-title"><h2>今天练什么</h2><button class="link" onclick="go('subjects')">学科与题量 ↗</button></div><div class="subject-list">${['数学','语文','英语'].map((name,i)=>{const q=plan.find(x=>x.name===name);return `<div class="subject-row ${q?'enabled':'muted-row'}"><div class="subject-mark">${['数','语','英'][i]}</div><div class="subject-info"><strong>${name}</strong><p>${q?q.title:state.reviewed&&name==='数学'?'本次练习已完成':state.subjects.includes(name)?'按计划留到下一次':'今天不安排'}</p></div><div class="subject-count"><strong>${q?q.count+' 题':state.reviewed&&name==='数学'?'已完成':'休息一下'}</strong>${q?`<span>约 ${q.minutes} 分钟</span>`:''}</div></div>`}).join('')}</div><div class="under-plan">${plan.some(x=>x.name==='数学')?'<button class="link" onclick="go(\'detail\')">查看选题依据</button>':'<span></span>'}${!state.deferred&&!state.reviewed&&plan.some(x=>x.name==='数学')?'<button class="link" onclick="go(\'defer\')">来不及？延后数学</button>':''}</div><section class="growth-banner" aria-label="成长奖励"><div class="growth-seal" aria-hidden="true">${state.claimed?'🦊':icon('chart')}</div><div class="growth-body"><h3>${state.claimed?'小芽狐，陪你一起长大':state.reviewed?'十题小步 · 徽章已解锁':'再完成 2 题，点亮第一枚徽章'}</h3><p>${state.reviewed?10:8} / 10 次练习 · ${state.reviewed?10:8} 成长积分</p><div class="progress" role="progressbar" aria-label="十题里程碑" aria-valuenow="${state.reviewed?10:8}" aria-valuemin="0" aria-valuemax="10"><i style="width:${state.reviewed?100:80}%"></i></div></div><button class="chevron" onclick="go('rewards')" aria-label="查看成长奖励">›</button></section><button class="attention-row" onclick="${state.confirmed?"toast('请补充阅读题的原始作答照片')":"go('analysis')"}"><span class="attention-dot"></span><div style="flex:1"><strong>${state.confirmed?1:2} 项材料等你确认</strong><p>${state.confirmed?'阅读题原始答案还不清楚':'补充一次观察，让分析更准确'}</p></div><span class="chevron" aria-hidden="true">›</span></button><div class="utility-row"><button class="link" onclick="go('profile')">孩子档案与能力观察</button><span class="mini">${esc(state.profile.grade)} · ${Object.values(state.profile.books).filter(Boolean).length}/3 科教材</span></div><div class="utility-row"><button class="link" onclick="go('ai')">AI 服务设置</button><span class="mini">尚未连接</span></div><div class="utility-row"><button class="link" onclick="go('settings')">计划与提醒</button><span class="mini">${state.reminder?state.remindAt:'已关闭'}</span></div><p class="home-footnote">每次少量练习，按自己的节奏来。延期会重新排期，不额外叠加题量。</p>`},
subjects:()=>{const plan=todayPlan(),total=plan.reduce((n,x)=>n+x.minutes,0),wanted=state.subjects.reduce((n,k)=>n+subjectMinutes(k,state.counts[k]),0);return `${back()}<div class="eyebrow">SUBJECT PLAN</div><h1>今天，练哪几科？</h1><p class="sub">选择一科、两科或三科，再调整各科题量。</p><div class="tabs">${[1,2,3].map(n=>`<button class="${state.subjects.length===n?'active':''}" onclick="setSubjectCount(${n})">${n} 科</button>`).join('')}</div><p class="mini">快捷选择按示例优先级：数学 → 语文 → 英语。也可逐科勾选。</p>${['数学','语文','英语'].map(name=>`<div class="card"><div class="row"><label class="check" style="margin:0"><input type="checkbox" ${state.subjects.includes(name)?'checked':''} onchange="toggleSubject('${name}',this.checked)">${name}</label><span class="pill gray">${subjectTitle(name)}</span></div><label>希望安排的题数</label><select ${!state.subjects.includes(name)?'disabled':''} onchange="state.counts['${name}']=Number(this.value);render()">${(name==='数学'?[1,2]:[1]).map(n=>`<option value="${n}" ${state.counts[name]===n?'selected':''}>${n} 题 · 约 ${subjectMinutes(name,n)} 分钟</option>`).join('')}</select><p class="mini">本原型可选候选：${name==='数学'?'原题 1 道，同类题 1 道':'1 道'}。正式版按实际题库提供选项。</p></div>`).join('')}<div class="card hero"><div class="row"><span>选中 ${state.subjects.length} 科，期望 ${wanted} 分钟</span><span class="pill">上限 ${state.limit} 分钟</span></div><h3 style="margin-top:15px">实际待练：${plan.length} 科 · ${plan.reduce((n,x)=>n+x.count,0)} 题 · ${total} 分钟</h3><p class="sub">${plan.map(x=>x.name+' '+x.count+' 题 / '+x.minutes+' 分钟').join('；')||'暂无待练任务'}</p></div>${wanted>state.limit?'<div class="note warn">超出上限：优先保留到期任务，数学可减为一道。仍放不下的学科顺延，不悄悄增加总时长。</div>':''}${state.deferred||state.reviewed?'<div class="note">数学已延后或完成，不会因重新选择学科再次加入今日任务。</div>':''}<div class="note">一题按一个题目编号计数，小题不拆开刷数量；用时是估计，实际完成后可更新。</div>${btn('使用这个计划',"go('home');toast('今日学科和题量已更新')",'wide')}`},
rewards:()=>`${back()}<div class="eyebrow">GROW TOGETHER</div><h1>每一个小步，<br>都值得被看见。</h1><p class="sub">家长和孩子一起看 · 不要求全对，不扣奖励</p><div class="card hero"><div class="row"><div><p class="sub">累计成长积分</p><div class="big">${state.reviewed?10:8}<small> 分</small></div></div><span style="font-size:65px">${state.claimed?'🦊':'🌱'}</span></div><p class="sub">来自已确认的计划内练习。重复上传不重复计奖。</p></div><div class="row section"><h2>我的里程碑</h2><span class="mini">进度长期保留</span></div><div class="card"><div class="row"><h3>🏅 十题小步</h3><span class="pill ${state.reviewed?'':'gray'}">${state.reviewed?'已获得':'8 / 10 题'}</span></div><p class="sub">累计完成 10 道计划内练习，并处理需要订正的问题。</p><div class="progress"><i style="width:${state.reviewed?100:80}%"></i></div><p class="mini">做错后认真订正同样计入；一道题同一天最多计一次。</p></div><div class="card"><div class="row"><h3>✨ 第一个知识点</h3><span class="pill gray">0 / 1 个</span></div><p class="sub">一个薄弱点达到“暂时退出”标准，获得掌握徽章和 5 积分。</p><p class="mini">退位减法：${state.reviewed&&state.h1==='独立'&&state.h2==='独立'?'已有 1 个跨日独立完成日期，还需另一天回看。':'仍需有证据的跨日独立复习。'}生成题或打印不增加进度。</p></div><div class="card" style="background:#f6efdf;text-align:center"><div style="font-size:72px;margin:8px">🦊</div><h2>${state.claimed?'小芽狐，来陪你慢慢长大':'解锁小伙伴 · 小芽狐'}</h2><p class="sub">获得「十题小步」即可领取。<br>不消耗积分，不需要每天喂养。</p><button class="button wide" ${!state.reviewed||state.claimed?'disabled':''} onclick="state.claimed=true;render();toast('已领取小芽狐！休息和延期都不会失去伙伴')">${state.claimed?'已领取':state.reviewed?'领取小伙伴':'还差 2 题'}</button></div><div class="card"><h3>奖励记录</h3>${state.reviewed?'<div class="item"><div class="num">+2</div><div>数学练习已确认<p class="mini">今天 · Q-001、Q-002 · 十题徽章自动解锁</p></div></div>':''}<div class="item"><div class="num">+8</div><div>历史练习积累<p class="mini">虚构演示数据 · 8 次符合规则的练习</p></div></div></div><div class="note">规则：计划内认真完成并处理订正，每题每天 +1 分，每日最多 +5 分；知识点首次达标 +5 分（独立里程碑）。不因答错、求助、延期或断签扣分。家长核实后入账，取消或纠正误记录时同步纠正账目。</div>${!state.reviewed?btn('体验完成两题后获奖',"state.mode='result';go('capture')",'wide'):''}`,
capture:()=>`${back()}<div class="note">AI 服务尚未连接，目前使用固定示例。<button class="link" onclick="go('ai')">配置 AI →</button></div><div class="eyebrow">CAPTURE & REVIEW</div><h1>把学习过程留下来</h1><p class="sub">先选择照片用途，系统才知道如何归档。</p><div class="tabs"><button class="${state.mode==='source'?'active':''}" onclick="state.mode='source';state.demoAnalysis=false;render()">作业 / 试卷入库</button><button class="${state.mode==='result'?'active':''}" onclick="state.mode='result';state.demoAnalysis=false;render()">练习结果回录</button></div><div class="photo">${state.photo?`<img src="${state.photo}" alt="用户选择的照片预览">`:icon('camera')}<h3>${state.mode==='source'?'拍完整题目与孩子的作答':'拍做完的练习单'}</h3><p class="sub">${state.mode==='source'?'保留题号、批改痕迹和上下文':'保留练习单编号，便于匹配原题'}</p><div class="actions">${btn('拍照',"document.getElementById('cameraInput').click()",'light')}${btn('从相册选择',"document.getElementById('albumInput').click()",'ghost')}</div><input id="cameraInput" type="file" accept="image/*" capture="environment" hidden onchange="pick(this)"><input id="albumInput" type="file" accept="image/*" hidden onchange="pick(this)"></div>${state.upload?`<p class="upload-status">已选择：${esc(state.upload)} · 仅本地预览</p>`:''}${state.mode==='source'?`<div class="card"><h3>识别之后，你会看到</h3><div class="item"><div class="num">1</div><div>题目与作答识别<p class="mini">看不清的内容先核实，不猜题。</p></div></div><div class="item"><div class="num">2</div><div>错题归类与相似题<p class="mini">关联已有薄弱点，减少重复练习。</p></div></div><div class="item"><div class="num">3</div><div>待确认的错误分析<p class="mini">观察事实与可能原因分别展示。</p></div></div></div>`:`<div class="card"><h3>匹配练习单</h3><p class="sub">正式版扫描练习单编号自动匹配；无法匹配时手动选择。</p><label>练习单</label><select><option>LP-1011 · 退位减法 · 2 题</option></select><label>这次整体帮助程度</label><select id="help"><option>未知 / 逐题确认</option><option>独立完成</option><option>有提醒或讲解</option></select><p class="mini">保存时仍逐题记录，避免整张卷子一概而论。</p></div>`}<div class="note">原型可预览照片，不上传、不进行真实识别；刷新会重置示例数据。下面使用固定样例演示${state.mode==='source'?'分析':'批改'}流程。</div>${btn('用示例体验'+(state.mode==='source'?'错题分析':'结果回录'),"captureAnalysisDemo()",'wide')}${state.demoAnalysis?`<section id="analysisResult"><div class="note">示例分析完成 · 请核对下方结果，尚未保存。</div>${state.mode==='source'?views.analysis():views.review()}</section>`:''}`,
analysis:()=>`${back('capture')}<div class="eyebrow">01 / 分析与确认</div><h1>发现一个值得复习的问题</h1><p class="sub">示例数学作业 · 第 2 页，第 6 题</p><div class="photo"><div class="sheet"><small>三年级数学 · 计算</small><div class="math">52 − 28 = <span class="wrong">34</span></div><small>观察：个位借位后，十位未减去借出的十。</small></div><span class="pill">题干与答案可确认</span> <span class="pill warn">原因待确认</span></div><div class="card"><div class="analysis-block"><strong>识别出的事实</strong><p>答案为 34，正确结果是 24；竖式十位仍按 5 − 2 计算。</p></div><div class="analysis-block"><strong>知识点</strong><p>两位数退位减法 · 退位后的十位处理</p></div><div class="analysis-block"><strong>可能需要加强</strong><p>退位规则理解，或书写退位标记的执行习惯。</p><p class="mini">仅凭卷面不能区分，更不能认定是态度问题。</p></div><div class="note">找到相似记录：10 月 8 日曾出现同一步骤错误。建议关联 M-001；本题来自不同作答，可新增出现记录。</div></div><div class="card"><h3>补充一次观察</h3><label>当时是否需要帮助？</label><select id="analysisHelp"><option value="">暂不清楚</option><option>独立作答后自行改正</option><option>一般提醒后改正</option><option>解题提示后完成</option><option>讲解或示范后完成</option></select><p class="mini">可先存为待核实；确认后也不自动宣称错因已经确定。</p></div><div class="actions">${btn('先存待核实',"toast('已保留在待核实队列，不安排扩题');go('library')",'light')}${btn('确认并归入错题库',"confirmAnalysis()")}</div>`,

function subjectTitle(n){return {数学:'退位减法',语文:'再 / 在',英语:'单词拼写'}[n]}
function subjectMinutes(n,c){return n==='数学'?(c===2?5:3):n==='语文'?3:2}
function todayPlan(){let remaining=state.limit,result=[];for(const name of ['数学','语文','英语']){if(!state.subjects.includes(name)||(name==='数学'&&(state.deferred||state.reviewed)))continue;let count=state.counts[name],minutes=subjectMinutes(name,count);if(minutes>remaining&&name==='数学'&&count===2){count=1;minutes=3}if(minutes<=remaining){result.push({name,count,minutes,title:subjectTitle(name)});remaining-=minutes}}return result}
function printSelection(){const p=todayPlan(),m=p.find(x=>x.name==='数学');return [!!m,!!m&&m.count===2,p.some(x=>x.name==='语文'),p.some(x=>x.name==='英语')]}
function setSubjectCount(n){state.subjects=['数学','语文','英语'].slice(0,n);render()}
function toggleSubject(name,on){if(!on&&state.subjects.length===1){render();toast('请至少保留一科学习偏好；当天可通过延期安排休息');return}state.subjects=on?[...state.subjects,name]:state.subjects.filter(x=>x!==name);render()}

const observationItems=[['mcalc','数学','计算步骤','熟悉的计算能否按步骤完成，并检查进退位？'],['mconcept','数学','概念与数量关系','能否说明为什么这样列式，而不只记住答案？'],['mread','数学','读题与应用','能否说清题目已知什么、要求什么？'],['cread','语文','识字与流畅阅读','能否独立读通当前课文，遇到生字能否借助工具？'],['cmeaning','语文','阅读理解','能否复述主要内容，并找到回答问题的依据？'],['cwrite','语文','书面表达','能否把一件事情按顺序写清楚，句子基本完整？'],['elisten','英语','听懂与认读','能否听懂、认读课内常用词句？'],['espell','英语','拼写与回忆','合上书后能否拼写学过的词，而不只是认得？'],['euse','英语','句型运用','换一个简单情境，能否使用学过的句型？'],['start','学习过程','开始与推进','任务明确时，能否开始并完成一小段约定任务？'],['check','学习过程','检查与订正','能否按约定检查，并处理发现的错误？'],['recall','学习过程','间隔回忆与求助','隔几天能否回忆方法；不会时能否说清卡在哪里？']];
function localDateString(date=new Date()){return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-')}
function birthDateAge(value,today=new Date()){if(!/^\d{4}-\d{2}-\d{2}$/.test(value||''))return null;const [y,m,d]=value.split('-').map(Number);const date=new Date(0);date.setFullYear(y,m-1,d);date.setHours(0,0,0,0);if(y<1||localDateString(date)!==value||value>localDateString(today))return null;return today.getFullYear()-y-((today.getMonth()+1<m||(today.getMonth()+1===m&&today.getDate()<d))?1:0)}
function profileAgeText(value){const age=birthDateAge(value);return age===null?'填写后自动计算当前年龄':`当前年龄：${age} 周岁（自动计算）`}
function updateProfileAge(){$('#profileAge').textContent=profileAgeText($('#pd').value)}
function saveProfile(){const birthDate=$('#pd').value.trim(),name=$('#pn').value.trim();if(!name){toast('请填写一个昵称');return}if(birthDate&&(birthDate>localDateString()||birthDateAge(birthDate)===null)){toast('请填写有效的出生日期，不能晚于今天');return}state.profile={name,birthDate,grade:$('#pg').value,region:$('#pr').value.trim(),term:$('#pt').value,books:Object.fromEntries(['数学','语文','英语'].map((n,i)=>[n,$('#pb'+i).value.trim()]))};go('profile');toast('档案已保存在本次演示中，教材映射仍待正式接入')}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),15000)}
async function shareBlob(){const canvas=document.createElement('canvas');canvas.width=900;canvas.height=1250;const c=canvas.getContext('2d');c.fillStyle='#f4efdf';c.fillRect(0,0,900,1250);c.textAlign='center';c.fillStyle='#193e39';const line=(t,y,size=34)=>{c.font=`${size}px sans-serif`;c.fillText(t,450,y,780)};line('小步复习 · 示例成果',100,27);line(state.profile.name+'的学习小记',220,44);line('示例练习日 · 10 月 11 日',290,26);line('完成 2 道数学练习',430,46);if(state.shareQuestion){line('52 − 28 = 24',530);line('61 − 37 = 24',590)}line(state.h1==='独立'&&state.h2==='独立'?'本次两题独立完成':'本次两题完成并核对正确',710,32);line('隔天再回看，逐步学得更稳。',770,28);if(state.shareBadge){line('已获得「十题小步」徽章',900,38);line('累计 10 次有效练习 · 本次 +2 积分',965,28)}line('每一步进展，都来自真实的尝试。',1130,26);return new Promise(resolve=>canvas.toBlob(resolve,'image/png'))}
async function saveShareImage(share){if(!state.reviewed){toast('请先确认本次练习结果');return}try{const blob=await shareBlob();if(!blob)throw new Error();const file=new File([blob],'小步复习-示例成果.png',{type:'image/png'});if(share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'小步复习 · 本次成果'});return}downloadBlob(blob,'小步复习-示例成果.png');toast(share?'当前浏览器未提供图片分享，已准备下载':'成果图片已准备下载')}catch(e){if(e.name!=='AbortError')toast('当前浏览器无法生成或分享图片，请换浏览器重试')}}
function exportLearningData(){const data={schemaVersion:'0.3-prototype',exportedAt:new Date().toISOString(),isDemo:true,scope:'当前原型可用数据，不含附件或完整历史',profile:state.profile,observations:{responses:state.observations,updatedAt:state.assessmentDate},questions:[{id:'Q-001',subject:'数学',text:'52 - 28 = ?',answer:'24',weaknessId:'M-001'},{id:'Q-002',subject:'数学',text:'61 - 37 = ?',answer:'24',parentId:'Q-001',weaknessId:'M-001'}],knowledgePoints:[{id:'M-001',title:'退位后的十位处理',status:state.reviewed?'复习中':'待间隔复习'}],attempts:state.reviewed?[{id:'demo-attempt-1',questionId:'Q-001',result:'正确',help:state.h1},{id:'demo-attempt-2',questionId:'Q-002',result:'正确',help:state.h2}]:[],plan:{subjects:state.subjects,counts:state.counts,limit:state.limit,deferred:state.deferred},rewards:{points:state.reviewed?10:8,badgeEarned:state.reviewed,petClaimed:state.claimed},attachments:[],omissions:['原始照片','完整历史作答','语文英语题库详情','生产级奖励事件账本']};downloadBlob(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'小步复习-演示备份.json');toast('已准备导出 JSON；这是演示快照，不是完整数据备份')}

const aiProviders={
'自定义兼容服务':{url:'',protocol:'responses',guide:'向服务商获取 Base URL、协议、模型 ID 和 Key。Codex 的 base_url 对应地址，model 对应模型，wire_api = responses 对应 Responses。'},
'OpenAI · GPT':{url:'https://api.openai.com/v1',protocol:'responses',console:'https://platform.openai.com/api-keys',guide:'在 API Keys 创建密钥，检查项目额度与模型权限。ChatGPT 订阅与 API 用量分开管理。'},
'Anthropic · Claude':{url:'https://api.anthropic.com/v1',protocol:'anthropic',console:'https://platform.claude.com/settings/keys',guide:'在开发者控制台创建 Key，从 API 文档复制模型 ID。官方使用 Anthropic Messages 和 x-api-key。'},
'DeepSeek':{url:'https://api.deepseek.com/v1',protocol:'chat',console:'https://platform.deepseek.com/api_keys',guide:'从开放平台获取 Key 和模型 ID。先确认模型支持图片；文本模型无法完成拍照分析。'},
'通义千问':{url:'https://dashscope.aliyuncs.com/compatible-mode/v1',protocol:'chat',console:'https://bailian.console.aliyun.com/',guide:'在百炼开通模型服务、创建 Key，复制视觉模型 ID。预设为中国内地地址，其他地域需对应地址和 Key。'},
'智谱 · GLM':{url:'https://open.bigmodel.cn/api/paas/v4',protocol:'chat',console:'https://open.bigmodel.cn/',guide:'在开放平台创建 API Key，从文档复制支持视觉输入的模型 ID。'}
};
function applyAIProvider(){const p=aiProviders[state.ai.provider];Object.assign(state.ai,{url:p.url,protocol:p.protocol,model:'',auth:p.protocol==='anthropic'?'x-api-key':'Bearer',effort:'default',saved:false,result:''});render();toast('已填入推荐参数，请从服务商复制模型 ID')}
function captureAnalysisDemo(){
 if(document.querySelector('.analysis-dialog'))return;
 const dialog=document.createElement('div');dialog.className='analysis-dialog';dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');
 dialog.innerHTML='<div class="analysis-dialog-card"><div class="loading-ring"></div><h2>正在分析照片 · 演示</h2><p class="mini">仅演示等待反馈，没有发送照片。</p></div>';document.body.append(dialog);
 setTimeout(()=>{dialog.innerHTML='<div class="analysis-dialog-card"><div class="analysis-success">✓</div><h2>示例分析成功</h2><p>2 秒后自动展示下方结果，请核对后保存。</p></div>';
 setTimeout(()=>{dialog.remove();state.demoAnalysis=true;render();document.getElementById('analysisResult')?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'})},2000)},1000);
}
function aiEndpoint(){return state.ai.url.trim().replace(/\/+$/,'')+({responses:'/responses',chat:'/chat/completions',anthropic:'/messages'}[state.ai.protocol])}
function updateAI(key,value){state.ai[key]=value;state.ai.saved=false;state.ai.result=''}
function validateAI(){let u;try{u=new URL(state.ai.url.trim())}catch{toast('请填写完整的 HTTPS Base URL');return false}if(u.protocol!=='https:'||u.username||u.password||u.search||u.hash){toast('请使用 HTTPS 基础地址，不带凭据、查询参数或片段');return false}if(/\/(responses|chat\/completions|messages)\/?$/.test(u.pathname)){toast('Base URL 不要包含具体接口路径，协议会自动追加');return false}if(!state.ai.model.trim()){toast('请填写示例模型 ID，以查看配置流程');return false}return true}
function saveAI(){if(!validateAI())return;state.ai.saved=true;render();toast('演示配置已保存在当前页面中；未连接 AI，刷新会重置')}
function testAI(){if(!validateAI())return;state.ai.result='流程通过示例';render();toast('仅展示检测结果样例，没有发送请求')}
function aiResult(){return {'流程通过示例':'示例：认证、文本、图片与结构化输出均通过。此结果是预设演示，不证明你的服务可用。','401 认证失败示例':'示例：服务拒绝认证。检查 Key 的有效性、权限及认证请求头；日志不展示 Key。','404 路径不匹配示例':'示例：请求路径不存在。核对 Base URL、接口协议及是否重复拼接 /v1；不能只凭 404 确定是哪一项。','图片能力不支持示例':'示例：文本可调用，但图片请求失败。检查模型能力、图片格式与服务商限制。'}[state.ai.result]||'保存配置后可演示检测流程，也可选择失败示例。实际响应与诊断需正式接入后获取。'}

function toggleTheme(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('littlestride-theme',document.documentElement.dataset.theme)}catch{}}
try{document.documentElement.dataset.theme=localStorage.getItem('littlestride-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch{document.documentElement.dataset.theme='light'}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pick(input){let f=input.files[0];if(!f)return;if(state.photo)URL.revokeObjectURL(state.photo);state.photo=URL.createObjectURL(f);state.upload=f.name;render()}
function confirmAnalysis(){let help=$('#analysisHelp').value;if(!help){toast('可先存待核实，或选择当时的帮助情况');return}state.confirmed=true;go('library');toast('已关联 M-001，保留具体错因待观察')}
function questionsHTML(print){let q=['计算：52 − 28 = ______','计算：61 − 37 = ______','选择“再”或“在”填空：<br>明天（　）来。　我（　）学校。','根据中文写出单词：苹果 __________'];let n=0;return q.map((t,i)=>state.selected[i]?`<div class="${print?'printq':'question'}"><span>${++n}. ${t}</span><div class="answer-space"></div></div>`:'').join('')||'<p>请至少选择一道题。</p>'}
function printSheet(){if(!state.selected.some(Boolean)){toast('请至少选择一道题');return}$('#printArea').innerHTML='<h1>今日小练习</h1><p>练习单 LP-1011　姓名：________　日期：________</p>'+questionsHTML(true)+'<p style="margin-top:18mm;font-size:10px">小步复习 · 手机原型示例练习单</p>';window.print()}
function saveReview(){if(state.reviewed){toast('本次记录已保存，未重复计数');return}let a=$('#h1').value,b=$('#h2').value;if(!a||!b||!$('#reviewcheck').checked){toast('请选择每题的帮助程度，并确认识别结果');return}state.h1=a;state.h2=b;state.reason=$('#reason').value;state.reviewed=true;go('progress');toast('已记录两题，获得 2 积分与十题徽章；可在首页查看奖励')}
function saveSettings(){state.limit=Number($('#limit').value);state.reminder=$('#reminder').checked;state.remindAt=$('#time').value||'19:45';go('home');toast('演示设置已保存；不发送真实通知')}
render();
</script></body></html>
