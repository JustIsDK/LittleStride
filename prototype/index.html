<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>小步复习 · 手机原型</title>
<style>
:root{--ink:#193e39;--muted:#73837e;--green:#24775e;--pale:#e6f0e8;--paper:#fafbf7;--line:#e3e9df;--orange:#ac6728;--gold:#fbefdd}*{box-sizing:border-box}body{margin:0;background:#e9eee8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px}button,input,select{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e0b96c;outline-offset:2px}button:disabled{opacity:.4;cursor:default}.shell{max-width:430px;min-height:100dvh;margin:auto;background:var(--paper);position:relative;box-shadow:0 0 90px #253f3510}.top{padding:20px 22px 10px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:750;letter-spacing:1px;font-size:18px;display:flex;gap:9px;align-items:center}.brand i{display:grid;place-items:center;width:30px;height:30px;background:var(--green);color:white;border-radius:10px;font-style:normal}.avatar{border-radius:50%;background:#e8e2ce;padding:9px 10px;font-weight:600}.demo{margin:0 22px 14px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}.demo button{background:none;color:var(--green);padding:0;font-size:11px}main{padding:8px 22px 110px}h1{font-size:29px;line-height:1.3;letter-spacing:-.8px;margin:4px 0 9px}h2{font-size:18px;margin:0}h3{font-size:16px;margin:0 0 8px}p{line-height:1.7;margin:7px 0}.sub{color:var(--muted);font-size:13px}.eyebrow{font-size:11px;letter-spacing:1.4px;color:var(--green);margin:3px 0 10px;font-weight:650}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.section{margin-top:25px;margin-bottom:13px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}.hero{background:var(--ink);color:white;border:0;padding:23px;position:relative;overflow:hidden}.hero:after{content:'◌';font-size:170px;position:absolute;right:-21px;top:-25px;color:#ffffff09;pointer-events:none}.hero .sub{color:#bdd0c5}.big{font-size:43px;font-weight:650;letter-spacing:-2px}.big small{font-size:14px;font-weight:400;letter-spacing:0;color:#bcd1c6}.pill{display:inline-block;font-size:11px;padding:5px 8px;background:var(--pale);color:var(--green);border-radius:7px;white-space:nowrap}.pill.warn{background:var(--gold);color:var(--orange)}.pill.gray{color:#66736e;background:#eef1ed}.hero .pill{background:#ffffff16;color:#e3f1e5}.button{border-radius:12px;min-height:45px;padding:12px 16px;background:var(--green);color:white;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}.button.light{background:var(--pale);color:var(--green)}.button.white{background:white;color:var(--ink)}.button.ghost{background:transparent;color:var(--green);border:1px solid var(--line)}.wide{width:100%}.actions{display:flex;gap:9px;margin-top:16px}.actions>*{flex:1}.link{color:var(--green);background:none;padding:4px 0;font-size:13px}.note{padding:12px 14px;background:#f1f3ec;color:#64756c;border-radius:12px;font-size:12px;line-height:1.7;margin:14px 0}.note.warn{background:var(--gold);color:#966024}.item{display:flex;gap:13px;padding:16px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.num{width:35px;height:35px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;background:var(--pale);color:var(--green);font-weight:650}.itembody{flex:1}.itembody h3{font-size:14px;margin:0 0 7px}.mini{font-size:11px;color:var(--muted);line-height:1.7}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:#ffffffed;border-top:1px solid var(--line);display:flex;z-index:10;backdrop-filter:blur(14px)}.nav button{flex:1;background:none;color:#8b9690;font-size:11px;display:grid;gap:5px;justify-items:center}.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}.nav .active{color:var(--green);font-weight:650}.capture-nav span:first-child{background:var(--green);color:white;border-radius:12px;padding:6px 13px;margin-top:-9px}.back{display:flex;align-items:center;gap:8px;background:none;color:var(--green);padding:0;margin:4px 0 20px}.tabs{display:flex;gap:6px;background:#edf1e9;border-radius:12px;padding:5px;margin:19px 0}.tabs button{flex:1;border-radius:9px;padding:10px 3px;background:none;color:var(--muted);font-size:12px}.tabs .active{background:white;color:var(--ink);box-shadow:0 2px 6px #00000006}.photo{border-radius:19px;padding:20px;background:#ecefe7;border:1px dashed #b1c5b8;text-align:center;margin:15px 0}.photo svg{width:40px;height:40px;stroke:var(--green);fill:none;stroke-width:1.4;margin:6px}.sheet{background:white;border:1px solid #e6e6da;box-shadow:0 4px 10px #283d3010;padding:20px;transform:rotate(-1deg);text-align:left;margin:13px auto;max-width:265px;color:#4d5550;font-family:serif}.sheet .math{font-size:25px;padding:14px 0}.wrong{color:#b86a55;text-decoration:line-through}.photo img{max-width:100%;max-height:190px;border-radius:10px}.progress{height:6px;background:#e7eee5;border-radius:5px;overflow:hidden;margin:12px 0}.progress>i{display:block;height:100%;background:var(--green);border-radius:5px}.step{border-left:2px solid #d9e5d9;padding:0 0 21px 19px;margin-left:5px;position:relative}.step:before{content:'';width:10px;height:10px;background:#77a28c;border-radius:50%;position:absolute;left:-6px;top:4px}.step:last-child{padding-bottom:0}.step strong{font-size:13px}.step p{font-size:12px;color:var(--muted)}label{display:block;font-size:12px;color:#536b60;margin:16px 0 6px}input:not([type=checkbox]),select{border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;background:white;color:var(--ink)}input[type=checkbox]{accent-color:var(--green);width:17px;height:17px}.check{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--ink);font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{border-radius:16px;padding:16px;background:#edf2e9}.metric strong{display:block;font-size:27px;margin-bottom:6px}.metric span{font-size:11px;color:var(--muted)}.statusbar{display:flex;gap:5px;margin:14px 0}.statusbar i{height:7px;flex:1;background:#e2e9de;border-radius:7px}.statusbar i.on{background:var(--green)}.floating{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);max-width:360px;width:85%;background:#173b35;color:white;font-size:13px;border-radius:12px;padding:14px 18px;z-index:30;box-shadow:0 6px 20px #0002;line-height:1.6}.paper-preview{background:white;border:1px solid var(--line);padding:22px;border-radius:3px;margin:16px 0;color:#252d29}.paper-preview h2{font-size:20px}.question{padding:20px 0;border-bottom:1px dashed #ddd;line-height:1.8}.answer-space{height:58px}.code{font-family:monospace;font-size:12px;letter-spacing:2px}.settings-row{padding:15px 0;border-bottom:1px solid var(--line)}.empty{text-align:center;padding:25px 10px}.upload-status{color:var(--green);font-size:12px;word-break:break-all}.analysis-block{margin:15px 0}.analysis-block strong{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.hidden{display:none!important}#printArea{display:none}@media print{body{background:white}.shell,.toast{display:none!important}#printArea{display:block;padding:12mm;font-family:serif;color:#000}.printq{margin-top:12mm;page-break-inside:avoid;line-height:1.8}.printq .answer-space{height:25mm}@page{size:A4;margin:12mm}}@media(min-width:600px){.shell{margin:25px auto;border-radius:30px;min-height:calc(100dvh - 50px);overflow:hidden}.nav{border-radius:0 0 24px 24px}.top{padding-top:26px}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><i>↗</i>小步复习</div><button class="avatar" onclick="go('profile')" aria-label="孩子档案">小禾</button></header><div class="demo"><span>手机交互原型 · 全部为虚构示例</span><button onclick="resetDemo()">重置演示</button></div><main id="app"></main><nav class="nav" id="nav"></nav></div><div id="printArea"></div><script>
const icons={home:'<path d="M3 10 12 3l9 7v10H3Z"/><path d="M9 20v-7h6v7"/>',camera:'<path d="M3 7h4l2-3h6l2 3h4v13H3Z"/><circle cx="12" cy="13" r="4"/>',book:'<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 7h8M8 11h8M8 15h5"/>',chart:'<path d="M4 3v18h17M8 16v-4M13 16V7M18 16V4"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[n]}</svg>`;
let state={page:'home',mode:'source',filter:'全部',confirmed:false,generated:false,deferred:false,reviewed:false,reminder:true,limit:10,remindAt:'19:45',upload:'',photo:'',selected:[true,true,true],reviewReady:false,subjects:["数学","语文"],counts:{数学:2,语文:1,英语:1},claimed:false,profile:{name:"小禾",age:"",grade:"三年级",region:"上海",term:"上学期",books:{数学:"",语文:"",英语:""}},observations:{},assessmentDate:"",syncEnabled:false,lastSync:"",shareBadge:true,shareQuestion:true};
const $=s=>document.querySelector(s);
const btn=(t,act,cls='')=>`<button class="button ${cls}" onclick="${act}">${t}</button>`;
const back=(to='home')=>`<button class="back" onclick="go('${to}')">← 返回</button>`;
function toast(t){document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3500)}
function go(p){if(p==='print'&&state.page==='home')state.selected=printSelection();state.page=p;render();window.scrollTo(0,0)}
function resetDemo(){if(state.photo)URL.revokeObjectURL(state.photo);state={page:'home',mode:'source',filter:'全部',confirmed:false,generated:false,deferred:false,reviewed:false,reminder:true,limit:10,remindAt:'19:45',upload:'',photo:'',selected:[true,true,true],reviewReady:false,subjects:["数学","语文"],counts:{数学:2,语文:1,英语:1},claimed:false,profile:{name:"小禾",age:"",grade:"三年级",region:"上海",term:"上学期",books:{数学:"",语文:"",英语:""}},observations:{},assessmentDate:"",syncEnabled:false,lastSync:"",shareBadge:true,shareQuestion:true};render();toast('演示已重置')}
function render(){document.querySelector('.avatar').textContent=state.profile.name;let active=['home','capture','library','progress'].includes(state.page)?state.page:({analysis:'capture',review:'capture',detail:'library',print:'home',defer:'home',settings:'home',subjects:'home',rewards:'progress',profile:'home',assessment:'progress',ability:'progress',share:'progress',sync:'home'}[state.page]);$('#nav').innerHTML=[['home','home','今日'],['capture','camera','拍照'],['library','book','错题库'],['progress','chart','进展']].map(([p,i,t])=>`<button class="${active===p?'active ':''}${p==='capture'?'capture-nav':''}" onclick="go('${p}')"><span>${icon(i)}</span><span>${t}</span></button>`).join('');$('#app').innerHTML=views[state.page]();}
const views={
profile:()=>`${back()}<div class="eyebrow">CHILD PROFILE</div><h1>从了解孩子开始</h1><p class="sub">教材按学科填写，不根据地区自动猜版本。</p><div class="card"><h3>基本信息</h3><label>昵称</label><input id="pn" maxlength="12" value="${esc(state.profile.name)}"><div class="grid"><div><label>年龄（可选）</label><input id="pa" type="number" min="4" max="18" value="${esc(state.profile.age)}" placeholder="暂不填写"></div><div><label>年级</label><select id="pg">${['一年级','二年级','三年级','四年级','五年级','六年级'].map(n=>`<option ${n===state.profile.grade?'selected':''}>${n}</option>`).join('')}</select></div></div><label>学习地区</label><input id="pr" maxlength="30" value="${esc(state.profile.region)}" placeholder="省 / 市"><label>学期</label><select id="pt">${['上学期','下学期'].map(n=>`<option ${state.profile.term===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="card"><h3>各科教材与当前进度</h3>${['数学','语文','英语'].map((n,i)=>`<label>${n}</label><input id="pb${i}" maxlength="100" value="${esc(state.profile.books[n])}" placeholder="出版社 / 版本 / 册次 / 当前单元">`).join('')}<p class="mini">不确定可留空，后续补拍封面或版权页核实。原型仅记录文本，尚未接入教材目录。</p></div>${btn('保存孩子档案',"saveProfile()",'wide')}<div class="card"><h3>能力观察</h3><p class="sub">约 3 分钟的家长观察，结合真实作答逐步补充。</p><div class="actions">${btn('填写观察',"go('assessment')",'light')}${btn('看多维分析',"go('ability')",'ghost')}</div></div><div class="card"><h3>数据与计划</h3><div class="actions">${btn('iCloud 与数据迁移',"go('sync')",'light')}${btn('提醒与时间',"go('settings')",'ghost')}</div></div><div class="note">无须填写真名、学校或精确生日。当前为本地页面演示，刷新会重置填写内容；可导出演示备份。</div>`,
assessment:()=>`${back('profile')}<div class="eyebrow">LEARNING OBSERVATION</div><h1>先观察，再下判断</h1><p class="sub">回想最近两周。没有观察过就选“不清楚”，不用额外考孩子。</p><div class="note">约 3 分钟 · 可分次补充。这里记录家长观察，不生成智力、性格或注意力诊断。</div>${observationItems.map(([id,group,title,question])=>`<div class="card"><span class="pill gray">${group}</span><h3 style="margin-top:13px">${title}</h3><p class="sub">${question}</p><select onchange="state.observations['${id}']=this.value"><option value="">不清楚 / 未观察</option>${['多数时候独立完成','偶尔需要提醒','经常需要帮助'].map(v=>`<option ${state.observations[id]===v?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')}${btn('保存观察，查看分析',"state.assessmentDate=new Date().toLocaleDateString('zh-CN');go('ability');toast('已保存家长观察，未改变知识点掌握状态')",'wide')}`,
ability:()=>`${back('profile')}<div class="eyebrow">ABILITY OVERVIEW</div><h1>薄弱点，要有依据</h1><p class="sub">${esc(state.profile.name)} · ${esc(state.profile.grade)} · 不同能力分别观察</p><div class="grid" style="margin-top:16px"><div class="metric"><strong>${Object.values(state.observations).filter(Boolean).length} / ${observationItems.length}</strong><span>家长已观察维度</span></div><div class="metric"><strong>1</strong><span>有示例作答证据的维度</span></div></div><div class="note">家长观察与题目证据分别显示。未填写或未练过，不视为能力弱。${state.assessmentDate?'观察更新：'+esc(state.assessmentDate):''}</div>${['数学','语文','英语','学习过程'].map(group=>`<div class="row section"><h2>${group}</h2></div>${observationItems.filter(x=>x[1]===group).map(([id,g,title])=>`<div class="card"><div class="row"><h3>${title}</h3><span class="pill ${state.observations[id]==='经常需要帮助'?'warn':'gray'}">${state.observations[id]?state.observations[id]==='经常需要帮助'?'建议关注':state.observations[id]==='多数时候独立完成'?'相对顺利':'继续观察':'待观察'}</span></div><p class="sub">家长反馈：${state.observations[id]||'尚未观察'}</p><p class="mini">作答证据：${id==='mcalc'?'退位减法两次出现相同步骤错误；'+(state.reviewed?'本次两题正确，帮助程度见练习记录。':'订正后尚需间隔独立回看。'):'当前无对应作答证据，不作结论。'}</p>${id==='mcalc'?'<button class="link" onclick="go(\'detail\')">查看证据与代表题 →</button>':''}</div>`).join('')}`).join('')}<div class="card hero"><h3>下一步先做什么</h3><p>先确认退位规则，再用一道同类题回看；未确认的观察通过今后的作业逐步验证。</p><p class="sub">${Object.entries(state.observations).filter(([k,v])=>v==='经常需要帮助').length?'有需要关注的家长观察：先保留为核实线索，不自动叠加专项练习。':'继续积累真实作答，不为了补齐维度额外加测。'}</p></div><div class="actions">${btn('补充观察',"go('assessment')",'light')}${btn('调整今日计划',"go('subjects')")}</div>`,
share:()=>`${back('progress')}<div class="eyebrow">A LITTLE PROGRESS</div><h1>把这一步，留下来</h1><p class="sub">家长先预览，再决定保存或分享到哪里。</p><div class="card" style="background:#f4efdf;text-align:center;padding:28px 20px"><span class="pill">小步复习 · 示例成果</span><div style="font-size:60px;margin:16px">${state.reviewed?'🌟':'🌱'}</div><h2>${esc(state.profile.name)}的学习小记</h2><p class="sub">示例练习日 · 10 月 11 日</p>${state.reviewed?`<h1 style="font-size:25px;margin-top:20px">完成 2 道数学练习</h1>${state.shareQuestion?'<p>52 − 28 = 24<br>61 − 37 = 24</p>':''}<p>${state.h1==='独立'&&state.h2==='独立'?'两题独立完成。<br>下一步：隔天再试，看看是否稳定。':'两题完成并核对正确。<br>继续练习，逐步减少帮助。'}</p>${state.shareBadge?'<div class="card"><h3>🏅 十题小步</h3><p class="mini">累计完成 10 次有效练习<br>本次获得 2 成长积分</p></div>':''}`:'<p>本次还没有确认的练习结果。<br>完成回录后再生成成果卡。</p>'}<p class="mini" style="margin-top:20px">每一步进展，都来自真实的尝试。</p></div><div class="card"><h3>分享内容</h3><label class="check"><input type="checkbox" ${state.shareQuestion?'checked':''} onchange="state.shareQuestion=this.checked;render()">显示本次题目</label><label class="check"><input type="checkbox" ${state.shareBadge?'checked':''} onchange="state.shareBadge=this.checked;render()">显示已获得徽章与积分</label><p class="mini">只展示昵称与本次成果；不带年龄、地区、教材、能力短板或原始作业照片。当前导出均标注“示例”。</p></div><div class="actions"><button class="button light" ${!state.reviewed?'disabled':''} onclick="saveShareImage(false)">保存成果图片</button><button class="button" ${!state.reviewed?'disabled':''} onclick="saveShareImage(true)">分享成果图片</button></div><div class="note">分享会调用手机系统选择界面，由你选择应用和接收对象。浏览器不支持时可保存图片，再自行分享。</div>`,
sync:()=>`${back('profile')}<div class="eyebrow">DATA & ICLOUD</div><h1>学习记录，跟着孩子走</h1><p class="sub">同一 App 换机恢复；跨 App 用结构化备份迁移。</p><div class="card"><div class="row"><h3>iCloud 同步</h3><span class="pill gray">原型未连接</span></div><label class="check"><input type="checkbox" ${state.syncEnabled?'checked':''} onchange="state.syncEnabled=this.checked;render()">演示启用同步</label><p class="sub">${state.syncEnabled?'已选择演示同步，尚未连接 Apple 账号。':'正式版使用当前设备的 iCloud 账号。'}</p><p class="mini">真实已上传：0 条 · 尚无真实同步时间</p><div class="actions">${btn('查看同步过程',"toast('流程演示：本地保存 → 等待网络 → 上传变化 → 拉取远端 → 合并；此页面不上传数据')",'light')}${btn('查看恢复预览',"document.getElementById('restoreInfo').classList.toggle('hidden')",'ghost')}</div><div id="restoreInfo" class="note hidden">恢复预览示例：档案 1 份、题目 4 道、薄弱点 3 项。正式版先显示账号、版本、记录与附件状态，再选择合并；这里不执行恢复。</div></div><div class="card"><h3>结构化保存的内容</h3>${['孩子档案与教材','原题、同类题及来源附件','知识点与薄弱点关联','每次作答、帮助程度和能力观察','计划、延期记录和奖励事件'].map(t=>`<div class="item"><span style="color:var(--green)">✓</span><span>${t}</span></div>`).join('')}<p class="mini">离线先保存；恢复网络后同步变更。同步不是历史备份，误删可能同步到其他设备。</p></div><div class="card"><h3>跨 App 迁移与备份</h3><p class="sub">其他 App 不能自动读取本 App 的私有 iCloud 数据。保留带版本和稳定编号的数据包，交给支持导入的应用。</p>${btn('导出当前演示数据 · JSON',"exportLearningData()",'wide light')}<p class="mini">此原型导出档案、观察、示例题目/知识点/作答与奖励状态；不包含原图和完整生产数据。正式版导出 JSON + 附件 + 清单组成的数据包。</p></div><div class="note">当前 HTML 原型无法实现真实 iCloud 同步。正式版 iOS App 需配置 iCloud/CloudKit、账号权限和恢复流程。本页只演示状态与入口；刷新仍会重置页面数据。</div>`,

home:()=>{const plan=todayPlan(),total=plan.reduce((n,x)=>n+x.minutes,0),count=plan.reduce((n,x)=>n+x.count,0);return `<div class="eyebrow">SUNDAY · 演示日程 10 月 11 日</div><h1>每天一点，慢慢学会。</h1><p class="sub">${esc(state.profile.name)} · ${esc(state.profile.grade)}　先把校内基础练扎实</p><div class="card hero"><div class="row"><span>${total?'今日待练计划':'今日待练已清空'}</span><span class="pill">${plan.length} 科 · ${count} 题</span></div><div style="margin:17px 0 5px"><span class="big">${total} <small>分钟左右</small></span></div><p class="sub">每日上限 ${state.limit} 分钟 · 可按学科调整</p><div class="actions">${total?btn('预览并打印',"go('print')",'white'):btn('查看进展',"go('progress')",'white')}${btn('选学科与题量',"go('subjects')",'white')}</div></div><div class="row section"><h2>今天练哪几科</h2><button class="link" onclick="go('subjects')">调整 →</button></div><div class="card" style="padding-top:0;padding-bottom:0">${['数学','语文','英语'].map((name,i)=>{let q=plan.find(x=>x.name===name);return `<div class="item"><div class="num">${['数','语','英'][i]}</div><div class="itembody"><div class="row"><h3>${name}</h3><span class="pill ${q?'':'gray'}">${q?q.count+' 题 · 约 '+q.minutes+' 分钟':state.reviewed&&name==='数学'?'本次已完成':'今日未安排'}</span></div><p class="mini">${q?q.title:state.subjects.includes(name)?'已完成、延后或受时间上限限制':'可在学科设置中选入'}</p>${q&&name==='数学'?btn('查看选题依据',"go('detail')",'light'):''}</div></div>`}).join('')}</div><div class="actions">${btn('做完了，拍照回录',"state.mode='result';go('capture')",'light')}${!state.deferred&&!state.reviewed&&plan.some(x=>x.name==='数学')?btn('延期数学练习',"go('defer')",'ghost'):''}</div><div class="card" style="background:#f6efdf"><div class="row"><div><span class="eyebrow">成长奖励</span><h3 style="margin-top:8px">${state.claimed?'你的伙伴：小芽狐':state.reviewed?'「十题小步」徽章已获得':'再完成 2 题，解锁首枚徽章'}</h3><p class="mini">累计 ${state.reviewed?10:8} 题 · ${state.reviewed?10:8} 成长积分</p></div><span style="font-size:42px">${state.claimed?'🦊':'🌱'}</span></div><div class="progress"><i style="width:${state.reviewed?100:80}%"></i></div><button class="link" onclick="go('rewards')">查看徽章与小伙伴 →</button></div><div class="card"><div class="row"><div><h3>孩子档案与能力观察</h3><p class="mini">${esc(state.profile.region)} · ${esc(state.profile.grade)} · ${Object.values(state.profile.books).filter(Boolean).length}/3 科已填教材</p></div><button class="link" onclick="go('profile')">完善 →</button></div></div><div class="row section"><h2>需要你确认</h2><span class="pill warn">${state.confirmed?'1':'2'} 项</span></div><div class="card"><h3>${state.confirmed?'阅读题 · 原始答案不清楚':'数学作业 · 当时如何完成？'}</h3><p class="sub">${state.confirmed?'需要补充原始作答，暂不安排练习。':'题目有退位步骤错误，需要补充帮助情况。'}</p><button class="link" onclick="${state.confirmed?"toast('请补充原始作答照片')":"go('analysis')"}">查看待核实内容 →</button></div><div class="note">${state.reminder?'每天 '+state.remindAt+' 提醒':'提醒已关闭'} · 已选学科不要求每天全部完成；超出时间上限的题保留到后续计划。<button class="link" onclick="go('settings')">设置</button></div>`},
subjects:()=>{const plan=todayPlan(),total=plan.reduce((n,x)=>n+x.minutes,0),wanted=state.subjects.reduce((n,k)=>n+subjectMinutes(k,state.counts[k]),0);return `${back()}<div class="eyebrow">SUBJECT PLAN</div><h1>今天，练哪几科？</h1><p class="sub">选择一科、两科或三科，再调整各科题量。</p><div class="tabs">${[1,2,3].map(n=>`<button class="${state.subjects.length===n?'active':''}" onclick="setSubjectCount(${n})">${n} 科</button>`).join('')}</div><p class="mini">快捷选择按示例优先级：数学 → 语文 → 英语。也可逐科勾选。</p>${['数学','语文','英语'].map(name=>`<div class="card"><div class="row"><label class="check" style="margin:0"><input type="checkbox" ${state.subjects.includes(name)?'checked':''} onchange="toggleSubject('${name}',this.checked)">${name}</label><span class="pill gray">${subjectTitle(name)}</span></div><label>希望安排的题数</label><select ${!state.subjects.includes(name)?'disabled':''} onchange="state.counts['${name}']=Number(this.value);render()">${(name==='数学'?[1,2]:[1]).map(n=>`<option value="${n}" ${state.counts[name]===n?'selected':''}>${n} 题 · 约 ${subjectMinutes(name,n)} 分钟</option>`).join('')}</select><p class="mini">本原型可选候选：${name==='数学'?'原题 1 道，同类题 1 道':'1 道'}。正式版按实际题库提供选项。</p></div>`).join('')}<div class="card hero"><div class="row"><span>选中 ${state.subjects.length} 科，期望 ${wanted} 分钟</span><span class="pill">上限 ${state.limit} 分钟</span></div><h3 style="margin-top:15px">实际待练：${plan.length} 科 · ${plan.reduce((n,x)=>n+x.count,0)} 题 · ${total} 分钟</h3><p class="sub">${plan.map(x=>x.name+' '+x.count+' 题 / '+x.minutes+' 分钟').join('；')||'暂无待练任务'}</p></div>${wanted>state.limit?'<div class="note warn">超出上限：优先保留到期任务，数学可减为一道。仍放不下的学科顺延，不悄悄增加总时长。</div>':''}${state.deferred||state.reviewed?'<div class="note">数学已延后或完成，不会因重新选择学科再次加入今日任务。</div>':''}<div class="note">一题按一个题目编号计数，小题不拆开刷数量；用时是估计，实际完成后可更新。</div>${btn('使用这个计划',"go('home');toast('今日学科和题量已更新')",'wide')}`},
rewards:()=>`${back()}<div class="eyebrow">GROW TOGETHER</div><h1>每一个小步，<br>都值得被看见。</h1><p class="sub">家长和孩子一起看 · 不要求全对，不扣奖励</p><div class="card hero"><div class="row"><div><p class="sub">累计成长积分</p><div class="big">${state.reviewed?10:8}<small> 分</small></div></div><span style="font-size:65px">${state.claimed?'🦊':'🌱'}</span></div><p class="sub">来自已确认的计划内练习。重复上传不重复计奖。</p></div><div class="row section"><h2>我的里程碑</h2><span class="mini">进度长期保留</span></div><div class="card"><div class="row"><h3>🏅 十题小步</h3><span class="pill ${state.reviewed?'':'gray'}">${state.reviewed?'已获得':'8 / 10 题'}</span></div><p class="sub">累计完成 10 道计划内练习，并处理需要订正的问题。</p><div class="progress"><i style="width:${state.reviewed?100:80}%"></i></div><p class="mini">做错后认真订正同样计入；一道题同一天最多计一次。</p></div><div class="card"><div class="row"><h3>✨ 第一个知识点</h3><span class="pill gray">0 / 1 个</span></div><p class="sub">一个薄弱点达到“暂时退出”标准，获得掌握徽章和 5 积分。</p><p class="mini">退位减法：${state.reviewed&&state.h1==='独立'&&state.h2==='独立'?'已有 1 个跨日独立完成日期，还需另一天回看。':'仍需有证据的跨日独立复习。'}生成题或打印不增加进度。</p></div><div class="card" style="background:#f6efdf;text-align:center"><div style="font-size:72px;margin:8px">🦊</div><h2>${state.claimed?'小芽狐，来陪你慢慢长大':'解锁小伙伴 · 小芽狐'}</h2><p class="sub">获得「十题小步」即可领取。<br>不消耗积分，不需要每天喂养。</p><button class="button wide" ${!state.reviewed||state.claimed?'disabled':''} onclick="state.claimed=true;render();toast('已领取小芽狐！休息和延期都不会失去伙伴')">${state.claimed?'已领取':state.reviewed?'领取小伙伴':'还差 2 题'}</button></div><div class="card"><h3>奖励记录</h3>${state.reviewed?'<div class="item"><div class="num">+2</div><div>数学练习已确认<p class="mini">今天 · Q-001、Q-002 · 十题徽章自动解锁</p></div></div>':''}<div class="item"><div class="num">+8</div><div>历史练习积累<p class="mini">虚构演示数据 · 8 次符合规则的练习</p></div></div></div><div class="note">规则：计划内认真完成并处理订正，每题每天 +1 分，每日最多 +5 分；知识点首次达标 +5 分（独立里程碑）。不因答错、求助、延期或断签扣分。家长核实后入账，取消或纠正误记录时同步纠正账目。</div>${!state.reviewed?btn('体验完成两题后获奖',"state.mode='result';go('capture')",'wide'):''}`,
capture:()=>`${back()}<div class="eyebrow">CAPTURE & REVIEW</div><h1>把学习过程留下来</h1><p class="sub">先选择照片用途，系统才知道如何归档。</p><div class="tabs"><button class="${state.mode==='source'?'active':''}" onclick="state.mode='source';render()">作业 / 试卷入库</button><button class="${state.mode==='result'?'active':''}" onclick="state.mode='result';render()">练习结果回录</button></div><div class="photo">${state.photo?`<img src="${state.photo}" alt="用户选择的照片预览">`:icon('camera')}<h3>${state.mode==='source'?'拍完整题目与孩子的作答':'拍做完的练习单'}</h3><p class="sub">${state.mode==='source'?'保留题号、批改痕迹和上下文':'保留练习单编号，便于匹配原题'}</p><div class="actions">${btn('拍照',"document.getElementById('cameraInput').click()",'light')}${btn('从相册选择',"document.getElementById('albumInput').click()",'ghost')}</div><input id="cameraInput" type="file" accept="image/*" capture="environment" hidden onchange="pick(this)"><input id="albumInput" type="file" accept="image/*" hidden onchange="pick(this)"></div>${state.upload?`<p class="upload-status">已选择：${esc(state.upload)} · 仅本地预览</p>`:''}${state.mode==='source'?`<div class="card"><h3>识别之后，你会看到</h3><div class="item"><div class="num">1</div><div>题目与作答识别<p class="mini">看不清的内容先核实，不猜题。</p></div></div><div class="item"><div class="num">2</div><div>错题归类与相似题<p class="mini">关联已有薄弱点，减少重复练习。</p></div></div><div class="item"><div class="num">3</div><div>待确认的错误分析<p class="mini">观察事实与可能原因分别展示。</p></div></div></div>`:`<div class="card"><h3>匹配练习单</h3><p class="sub">正式版扫描练习单编号自动匹配；无法匹配时手动选择。</p><label>练习单</label><select><option>LP-1011 · 退位减法 · 2 题</option></select><label>这次整体帮助程度</label><select id="help"><option>未知 / 逐题确认</option><option>独立完成</option><option>有提醒或讲解</option></select><p class="mini">保存时仍逐题记录，避免整张卷子一概而论。</p></div>`}<div class="note">原型可预览照片，不上传、不进行真实识别；刷新会重置示例数据。下面使用固定样例演示${state.mode==='source'?'分析':'批改'}流程。</div>${btn('用示例体验'+(state.mode==='source'?'错题分析':'结果回录'),state.mode==='source'?"go('analysis')":"go('review')",'wide')}`,
analysis:()=>`${back('capture')}<div class="eyebrow">01 / 分析与确认</div><h1>发现一个值得复习的问题</h1><p class="sub">示例数学作业 · 第 2 页，第 6 题</p><div class="photo"><div class="sheet"><small>三年级数学 · 计算</small><div class="math">52 − 28 = <span class="wrong">34</span></div><small>观察：个位借位后，十位未减去借出的十。</small></div><span class="pill">题干与答案可确认</span> <span class="pill warn">原因待确认</span></div><div class="card"><div class="analysis-block"><strong>识别出的事实</strong><p>答案为 34，正确结果是 24；竖式十位仍按 5 − 2 计算。</p></div><div class="analysis-block"><strong>知识点</strong><p>两位数退位减法 · 退位后的十位处理</p></div><div class="analysis-block"><strong>可能需要加强</strong><p>退位规则理解，或书写退位标记的执行习惯。</p><p class="mini">仅凭卷面不能区分，更不能认定是态度问题。</p></div><div class="note">找到相似记录：10 月 8 日曾出现同一步骤错误。建议关联 M-001；本题来自不同作答，可新增出现记录。</div></div><div class="card"><h3>补充一次观察</h3><label>当时是否需要帮助？</label><select id="analysisHelp"><option value="">暂不清楚</option><option>独立作答后自行改正</option><option>一般提醒后改正</option><option>解题提示后完成</option><option>讲解或示范后完成</option></select><p class="mini">可先存为待核实；确认后也不自动宣称错因已经确定。</p></div><div class="actions">${btn('先存待核实',"toast('已保留在待核实队列，不安排扩题');go('library')",'light')}${btn('确认并归入错题库',"confirmAnalysis()")}</div>`,
library:()=>`${back()}<div class="eyebrow">QUESTION LIBRARY</div><h1>少量代表题，清楚的记录</h1><p class="sub">按薄弱点归类 · 同类题不会重复堆积</p><div class="tabs">${['全部','待核实','数学','语文'].map(x=>`<button class="${state.filter===x?'active':''}" onclick="state.filter='${x}';render()">${x}</button>`).join('')}</div>${['全部','数学'].includes(state.filter)?`<div class="card" onclick="go('detail')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')go('detail')"><div class="row"><span class="pill">数学 · P1</span><span class="mini">M-001 →</span></div><h3 style="margin-top:16px">退位减法：十位处理</h3><p style="font-size:23px">52 − 28 = ?</p><p class="sub">${state.confirmed?'已确认归类':'已有代表题'} · ${state.generated?'2 道同类题':'1 道同类题'}</p><div class="row"><span class="pill gray">${state.reviewed?'复习中':'待间隔复习'}</span><span class="mini">近 14 天已知错误 2 次</span></div></div>`:''}${['全部','语文'].includes(state.filter)?`<div class="card"><div class="row"><span class="pill">语文 · P2</span><span class="mini">C-001</span></div><h3 style="margin-top:16px">“再 / 在”的句子运用</h3><p class="sub">明天（　）来 · 我（　）学校</p><span class="pill gray">复习中 · 已安排回看</span></div>`:''}${['全部','待核实','数学'].includes(state.filter)&&!state.confirmed?`<div class="card"><span class="pill warn">待核实 · 数学</span><h3 style="margin-top:13px">新拍作业 · 退位减法</h3><p class="sub">已识别错误；当时的帮助情况未知。</p><button class="link" onclick="go('analysis')">补充并确认 →</button></div>`:''}${['全部','待核实','语文'].includes(state.filter)?`<div class="card"><span class="pill warn">待核实 · 语文</span><h3 style="margin-top:13px">阅读题 · 第 3 题</h3><p class="sub">照片只有订正答案，无法确认原始表现。暂不安排练习。</p><button class="link" onclick="state.mode='source';go('capture')">补充照片 →</button></div>`:''}`,
detail:()=>`${back('library')}<div class="row"><span class="pill">数学 · M-001</span><span class="pill gray">${state.reviewed?'复习中':'待间隔复习'}</span></div><h1 style="margin-top:15px">退位后的十位，<br>记得少一个十。</h1><p class="sub">两位数退位减法 · P1 优先复习</p><div class="card"><h3>为什么选这道题</h3><p>两次不同作答都出现了退位后十位未调整的错误，保留 1 道代表原题。</p><p class="mini">证据：10/08 作业第 4 题、10/10 作业第 6 题。次数仅涵盖已录入记录。</p></div><div class="card"><div class="row"><h3>代表原题</h3><span class="mini">Q-001</span></div><p style="font-size:27px">52 − 28 = ?</p><p class="sub">原始答案 34 · 正确答案 24</p></div><div class="card"><div class="row"><h3>针对同一步骤的练习</h3><span class="pill">同类题</span></div><p style="font-size:23px">61 − 37 = ?</p><p class="mini">Q-002 · 关联 Q-001 · 答案 24</p>${state.generated?'<p style="font-size:23px">73 − 46 = ?</p><p class="mini">Q-003 · 新生成候选 · 答案 27</p>':''}<p class="sub">只更换数字，仍练习退位后的十位处理，不提高难度。</p>${btn(state.generated?'已生成，保留为候选':'再生成 1 道同类题',"state.generated=true;render();toast('已生成示例候选题，不自动增加今日任务')",'light wide')}</div><div class="note">生成了题 ≠ 孩子做过题。只有真实作答记录会改变掌握状态。</div><div class="actions">${btn('查看练习历程',"go('progress')",'light')}${btn('打印已选练习',"go('print')")}</div>`,
print:()=>`${back()}<div class="eyebrow">02 / 打印练习</div><h1>给孩子一张干净的练习单</h1><p class="sub">隐藏答案、错误标签和分析提示 · A4</p><div class="card"><h3>本次选择</h3><label class="check"><input type="checkbox" ${state.selected[0]?'checked':''} onchange="state.selected[0]=this.checked;render()">52 − 28 · 原题</label><label class="check"><input type="checkbox" ${state.selected[1]?'checked':''} onchange="state.selected[1]=this.checked;render()">61 − 37 · 同类题</label><label class="check"><input type="checkbox" ${state.selected[2]?'checked':''} onchange="state.selected[2]=this.checked;render()">再 / 在 · 字词练习</label><label class="check"><input type="checkbox" ${state.selected[3]?'checked':''} onchange="state.selected[3]=this.checked;render()">英语 · 单词拼写</label><p class="mini">勾选只影响打印内容，不会自动记为完成。</p></div><div class="paper-preview" id="paper"><div class="row"><h2>今日小练习</h2><span class="code">LP-1011</span></div><p class="mini">姓名：________　日期：________</p>${questionsHTML(false)}</div><div class="note">点击后打开浏览器 / 系统打印界面，可选择打印机或存为 PDF。实际连接和纸张设置由设备决定。</div>${btn('打印 / 保存为 PDF',"printSheet()",'wide')}<div class="actions">${btn('已做完，拍照录入',"state.mode='result';go('capture')",'light')}</div>`,
review:()=>`${back('capture')}<div class="eyebrow">03 / 回录与批改</div><h1>看见这一次的进步</h1><p class="sub">已匹配示例练习单 LP-1011 · 数学部分 2 题</p><div class="note warn">示例批改已就绪。请逐题核对识别结果，再保存练习记录。</div><div class="card"><div class="row"><h3>01　52 − 28 = 24</h3><span class="pill">正确</span></div><p class="mini">原题 Q-001 · 识别答案 24</p><label>本题帮助程度</label><select id="h1"><option value="">请选择</option><option>独立</option><option>一般提醒</option><option>解题提示</option><option>讲解或示范后完成</option><option>未知</option></select></div><div class="card"><div class="row"><h3>02　61 − 37 = 24</h3><span class="pill">正确</span></div><p class="mini">同类题 Q-002 · 识别答案 24</p><label>本题帮助程度</label><select id="h2"><option value="">请选择</option><option>独立</option><option>一般提醒</option><option>解题提示</option><option>讲解或示范后完成</option><option>未知</option></select></div><div class="card"><h3>这次能说明退位的理由吗？</h3><select id="reason"><option>未观察</option><option>能</option><option>部分能</option><option>不能</option></select><p class="mini">不必额外考试；如果练习中有说明，就记录下来。</p></div><label class="check"><input type="checkbox" id="reviewcheck">我已核对题目和作答识别结果</label><div class="note">本页演示固定的数学练习单回录，不绑定刚才的打印选题。其他科目保留原计划；确认后数学新增两条作答记录，并计入成长奖励。</div>${btn(state.reviewed?'本次记录已保存':'确认并保存本次表现',"saveReview()",'wide')}`,
progress:()=>`${back()}<div class="eyebrow">LEARNING PROGRESS</div><h1>${state.reviewed?'做对了，也要隔天再看看。':'看过程，比看一次分数更有用。'}</h1><p class="sub">退位减法 · M-001 · 根据实际记录判断</p><div class="grid" style="margin-top:20px"><div class="metric"><strong>${state.reviewed?'2 / 2':'—'}</strong><span>${state.reviewed?'本次题目正确':'尚无本次回录'}</span></div><div class="metric"><strong>${state.reviewed?(state.h1==='独立'&&state.h2==='独立'?'1':'0'):'0'}</strong><span>有证据的跨日独立完成日期</span></div></div><div class="card"><div class="row"><h3>当前掌握状态</h3><span class="pill">${state.reviewed?'复习中':'待间隔复习'}</span></div><div class="statusbar"><i class="on"></i><i class="${state.reviewed?'on':''}"></i><i></i></div><p>${state.reviewed?(state.h1==='独立'&&state.h2==='独立'?'本次两题独立完成，是进步的证据。仍需另一天复习，确认是否稳定。':'本次两题正确；帮助程度仍需纳入判断，暂不能据此认定能够稳定独立完成。'):'此前订正经过讲解，需要一次无解题提示的间隔复习。'}</p><p class="mini">同一天做对两题，不算两个独立复习日期。退出前还需结合关键理由和非照抄作答。</p></div><div class="actions">${btn("查看成长奖励", "go('rewards')", "light")}${btn("本次成果分享", "go('share')", "light")}</div><button class="link" onclick="go('ability')">查看多维能力观察 →</button><div class="row section"><h2>练习历程</h2><span class="mini">只追加，不覆盖</span></div><div class="card">${state.reviewed?`<div class="step"><strong>10 月 11 日 · 本次回录</strong><p>原题正确 · ${state.h1}；同类题正确 · ${state.h2}<br>理由说明：${state.reason}</p></div>`:''}<div class="step"><strong>10 月 10 日 · 当天订正</strong><p>讲解后正确，不能记为独立掌握。</p></div><div class="step"><strong>10 月 10 日 · 原始作答</strong><p>十位未处理退位，结果错误。</p></div><div class="step"><strong>10 月 8 日 · 首次发现</strong><p>相同步骤出现错误，收录为代表薄弱点。</p></div></div><div class="floating"><div class="row"><div><h3>下一次回看</h3><p class="mini">${state.reviewed?'10 月 13 日':'10 月 11 日'} · 约 3 分钟 · 一道同类题</p></div><span class="pill">不加量</span></div></div>`,
defer:()=>`${back()}<div class="eyebrow">PLAN ADJUSTMENT</div><h1>今天来不及，<br>我们重新排一排。</h1><p class="sub">延期会保留历史，不算答错，也不惩罚加题。</p><div class="card"><h3>要延后的内容</h3><p>数学 · 退位减法 2 题</p><p class="sub">约 5 分钟 · 原计划今天完成</p><label>最早可安排日期</label><select id="delaydate" onchange="document.getElementById('laterNote').textContent=this.value==='明天'?'数学明天复习；英语移至后天。':'数学后天复习；明天原计划保持。'"><option>明天</option><option>后天</option></select><label>原因（可选）</label><select><option>今天没有时间</option><option>孩子状态不佳</option><option>校内作业较多</option><option>其他</option></select></div><div class="card"><h3>调整预览</h3><div class="item"><div class="num">今</div><div>保留语文字词 · 3 分钟<p class="mini">数学延后，不增加今晚压力。</p></div></div><div class="item"><div class="num">后</div><div id="laterNote">数学明天复习；英语移至后天。</div></div><p class="sub">明天原有英语约 6 分钟；若加入数学合计 11 分钟，超过 ${state.limit} 分钟上限，优先安排数学，英语整体顺延。</p></div><div class="note">正式版根据到期时间、优先级、最近表现和可用时间排期。连续延期时建议缩小任务，而非无限累积。</div>${btn('确认调整',"state.deferred=true;state.delay=document.getElementById('delaydate').value;go('home');toast('演示计划已调整：数学安排到'+state.delay+'，其他任务按上限顺延')",'wide')}`,
settings:()=>`${back()}<div class="eyebrow">PLAN SETTINGS</div><h1>适合家里的节奏</h1><p class="sub">家长接收提醒，孩子不用操作这个 App。</p><div class="card"><h3>每日计划</h3><label>每日复习上限</label><select id="limit"><option value="10">10 分钟</option><option value="5" ${state.limit===5?'selected':''}>5 分钟</option></select><p class="mini">按选中的科目和候选题重新计算，不超过时间上限。</p><label class="check"><input id="reminder" type="checkbox" ${state.reminder?'checked':''}>开启每日提醒</label><label>提醒时间</label><input type="time" id="time" value="${state.remindAt}"></div><div class="card"><span class="pill">通知预览</span><h3 style="margin-top:13px">今天有一小步可以完成</h3><p class="sub">${todayPlan().map(x=>x.name).join(" + ")||"暂无待练"}，预计 ${todayPlan().reduce((n,x)=>n+x.minutes,0)} 分钟。</p><p class="mini">打开查看　·　稍后提醒　·　调整计划</p></div><div class="note">这是页面演示，不会真的发送通知。正式版首次启用时需申请手机通知权限；未授权时仍在首页展示计划。</div>${btn('保存设置',"saveSettings()",'wide')}`
};

function subjectTitle(n){return {数学:'退位减法',语文:'再 / 在',英语:'单词拼写'}[n]}
function subjectMinutes(n,c){return n==='数学'?(c===2?5:3):n==='语文'?3:2}
function todayPlan(){let remaining=state.limit,result=[];for(const name of ['数学','语文','英语']){if(!state.subjects.includes(name)||(name==='数学'&&(state.deferred||state.reviewed)))continue;let count=state.counts[name],minutes=subjectMinutes(name,count);if(minutes>remaining&&name==='数学'&&count===2){count=1;minutes=3}if(minutes<=remaining){result.push({name,count,minutes,title:subjectTitle(name)});remaining-=minutes}}return result}
function printSelection(){const p=todayPlan(),m=p.find(x=>x.name==='数学');return [!!m,!!m&&m.count===2,p.some(x=>x.name==='语文'),p.some(x=>x.name==='英语')]}
function setSubjectCount(n){state.subjects=['数学','语文','英语'].slice(0,n);render()}
function toggleSubject(name,on){if(!on&&state.subjects.length===1){render();toast('请至少保留一科学习偏好；当天可通过延期安排休息');return}state.subjects=on?[...state.subjects,name]:state.subjects.filter(x=>x!==name);render()}

const observationItems=[['mcalc','数学','计算步骤','熟悉的计算能否按步骤完成，并检查进退位？'],['mconcept','数学','概念与数量关系','能否说明为什么这样列式，而不只记住答案？'],['mread','数学','读题与应用','能否说清题目已知什么、要求什么？'],['cread','语文','识字与流畅阅读','能否独立读通当前课文，遇到生字能否借助工具？'],['cmeaning','语文','阅读理解','能否复述主要内容，并找到回答问题的依据？'],['cwrite','语文','书面表达','能否把一件事情按顺序写清楚，句子基本完整？'],['elisten','英语','听懂与认读','能否听懂、认读课内常用词句？'],['espell','英语','拼写与回忆','合上书后能否拼写学过的词，而不只是认得？'],['euse','英语','句型运用','换一个简单情境，能否使用学过的句型？'],['start','学习过程','开始与推进','任务明确时，能否开始并完成一小段约定任务？'],['check','学习过程','检查与订正','能否按约定检查，并处理发现的错误？'],['recall','学习过程','间隔回忆与求助','隔几天能否回忆方法；不会时能否说清卡在哪里？']];
function saveProfile(){const age=$('#pa').value.trim(),name=$('#pn').value.trim();if(!name){toast('请填写一个昵称');return}if(age&&(!Number.isInteger(Number(age))||Number(age)<4||Number(age)>18)){toast('年龄请填 4—18 的整数，或留空');return}state.profile={name,age,grade:$('#pg').value,region:$('#pr').value.trim(),term:$('#pt').value,books:Object.fromEntries(['数学','语文','英语'].map((n,i)=>[n,$('#pb'+i).value.trim()]))};go('profile');toast('档案已保存在本次演示中，教材映射仍待正式接入')}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),15000)}
async function shareBlob(){const canvas=document.createElement('canvas');canvas.width=900;canvas.height=1250;const c=canvas.getContext('2d');c.fillStyle='#f4efdf';c.fillRect(0,0,900,1250);c.textAlign='center';c.fillStyle='#193e39';const line=(t,y,size=34)=>{c.font=`${size}px sans-serif`;c.fillText(t,450,y,780)};line('小步复习 · 示例成果',100,27);line(state.profile.name+'的学习小记',220,44);line('示例练习日 · 10 月 11 日',290,26);line('完成 2 道数学练习',430,46);if(state.shareQuestion){line('52 − 28 = 24',530);line('61 − 37 = 24',590)}line(state.h1==='独立'&&state.h2==='独立'?'本次两题独立完成':'本次两题完成并核对正确',710,32);line('隔天再回看，逐步学得更稳。',770,28);if(state.shareBadge){line('已获得「十题小步」徽章',900,38);line('累计 10 次有效练习 · 本次 +2 积分',965,28)}line('每一步进展，都来自真实的尝试。',1130,26);return new Promise(resolve=>canvas.toBlob(resolve,'image/png'))}
async function saveShareImage(share){if(!state.reviewed){toast('请先确认本次练习结果');return}try{const blob=await shareBlob();if(!blob)throw new Error();const file=new File([blob],'小步复习-示例成果.png',{type:'image/png'});if(share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'小步复习 · 本次成果'});return}downloadBlob(blob,'小步复习-示例成果.png');toast(share?'当前浏览器未提供图片分享，已准备下载':'成果图片已准备下载')}catch(e){if(e.name!=='AbortError')toast('当前浏览器无法生成或分享图片，请换浏览器重试')}}
function exportLearningData(){const data={schemaVersion:'0.3-prototype',exportedAt:new Date().toISOString(),isDemo:true,scope:'当前原型可用数据，不含附件或完整历史',profile:state.profile,observations:{responses:state.observations,updatedAt:state.assessmentDate},questions:[{id:'Q-001',subject:'数学',text:'52 - 28 = ?',answer:'24',weaknessId:'M-001'},{id:'Q-002',subject:'数学',text:'61 - 37 = ?',answer:'24',parentId:'Q-001',weaknessId:'M-001'}],knowledgePoints:[{id:'M-001',title:'退位后的十位处理',status:state.reviewed?'复习中':'待间隔复习'}],attempts:state.reviewed?[{id:'demo-attempt-1',questionId:'Q-001',result:'正确',help:state.h1},{id:'demo-attempt-2',questionId:'Q-002',result:'正确',help:state.h2}]:[],plan:{subjects:state.subjects,counts:state.counts,limit:state.limit,deferred:state.deferred},rewards:{points:state.reviewed?10:8,badgeEarned:state.reviewed,petClaimed:state.claimed},attachments:[],omissions:['原始照片','完整历史作答','语文英语题库详情','生产级奖励事件账本']};downloadBlob(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'小步复习-演示备份.json');toast('已准备导出 JSON；这是演示快照，不是完整数据备份')}

function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pick(input){let f=input.files[0];if(!f)return;if(state.photo)URL.revokeObjectURL(state.photo);state.photo=URL.createObjectURL(f);state.upload=f.name;render()}
function confirmAnalysis(){let help=$('#analysisHelp').value;if(!help){toast('可先存待核实，或选择当时的帮助情况');return}state.confirmed=true;go('library');toast('已关联 M-001，保留具体错因待观察')}
function questionsHTML(print){let q=['计算：52 − 28 = ______','计算：61 − 37 = ______','选择“再”或“在”填空：<br>明天（　）来。　我（　）学校。','根据中文写出单词：苹果 __________'];let n=0;return q.map((t,i)=>state.selected[i]?`<div class="${print?'printq':'question'}"><span>${++n}. ${t}</span><div class="answer-space"></div></div>`:'').join('')||'<p>请至少选择一道题。</p>'}
function printSheet(){if(!state.selected.some(Boolean)){toast('请至少选择一道题');return}$('#printArea').innerHTML='<h1>今日小练习</h1><p>练习单 LP-1011　姓名：________　日期：________</p>'+questionsHTML(true)+'<p style="margin-top:18mm;font-size:10px">小步复习 · 手机原型示例练习单</p>';window.print()}
function saveReview(){if(state.reviewed){toast('本次记录已保存，未重复计数');return}let a=$('#h1').value,b=$('#h2').value;if(!a||!b||!$('#reviewcheck').checked){toast('请选择每题的帮助程度，并确认识别结果');return}state.h1=a;state.h2=b;state.reason=$('#reason').value;state.reviewed=true;go('progress');toast('已记录两题，获得 2 积分与十题徽章；可在首页查看奖励')}
function saveSettings(){state.limit=Number($('#limit').value);state.reminder=$('#reminder').checked;state.remindAt=$('#time').value||'19:45';go('home');toast('演示设置已保存；不发送真实通知')}
render();
</script></body></html>
